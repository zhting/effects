<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>晴雨便利店</title>
<style>
  :root { --void: #060a13; --vig: rgba(2, 4, 10, .6); --joy-ring: rgba(200, 220, 255, .28); --joy-knob: rgba(235, 242, 255, .55); color-scheme: dark; }
  html, body { height: 100%; margin: 0; background: var(--void); overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; cursor: grab; }
  #stage canvas:active { cursor: grabbing; }
  #joy { position: fixed; width: 112px; height: 112px; margin: -56px 0 0 -56px; border-radius: 50%; border: 1.5px solid var(--joy-ring); pointer-events: none; }
  #joy-knob { position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; border-radius: 50%; background: var(--joy-knob); transform: translate(-50%, -50%); }
  .vig { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse 75% 70% at 50% 52%, transparent 55%, var(--vig) 100%); }
  .back-portal { position: fixed; left: max(22px, env(safe-area-inset-left)); top: max(20px, env(safe-area-inset-top)); z-index: 20; padding: 6px 13px; border: 1px solid rgba(148, 197, 255, 0.28); border-radius: 999px; background: rgba(10, 18, 34, 0.68); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); font: 500 11.5px/1.4 ui-monospace, 'SF Mono', Menlo, monospace; letter-spacing: 0.14em; color: #dbeafe; text-decoration: none; transition: all 0.2s ease; }
  .back-portal:hover { background: rgba(18, 32, 58, 0.92); border-color: rgba(148, 197, 255, 0.6); transform: translateX(-2px); }
  .vrm-Dock { position: fixed; right: max(22px, env(safe-area-inset-right)); top: max(20px, env(safe-area-inset-top)); z-index: 20; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .vrm-btn { cursor: pointer; padding: 6px 14px; border: 1px solid rgba(56, 189, 248, 0.45); border-radius: 999px; background: rgba(12, 26, 48, 0.76); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); font: 600 12px/1.4 "Noto Sans SC", ui-monospace, sans-serif; letter-spacing: 0.08em; color: #e0f2fe; transition: all 0.2s ease; box-shadow: 0 4px 16px rgba(2, 8, 20, 0.45); }
  .vrm-btn:hover { background: rgba(14, 116, 144, 0.88); border-color: #7dd3fc; color: #fff; transform: translateY(-1px); }
  .vrm-btn--sub { border-color: rgba(148, 163, 184, 0.32); font-weight: 500; color: #cbd5e1; }
  .vrm-btn--sub:hover { background: rgba(30, 41, 59, 0.9); border-color: rgba(203, 213, 225, 0.6); }
  .vrm-status { padding: 5px 11px; border-radius: 999px; background: rgba(10, 18, 34, 0.58); border: 1px solid rgba(148, 197, 255, 0.18); font: 500 11px/1.4 ui-monospace, 'SF Mono', Menlo, monospace; letter-spacing: 0.06em; color: #93c5fd; pointer-events: none; }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@500;700;900&family=ZCOOL+QingKe+HuangYou&display=swap">
</head>
<body>
<a class="back-portal" href="../">← 特效展厅</a>
<div class="vrm-Dock">
  <span id="vrm-status" class="vrm-status">当前: 默认 VRM</span>
  <button type="button" id="vrm-upload-btn" class="vrm-btn" title="上传 .vrm 或 .glb 模型文件替换当前角色（快捷键 L）">替换 VRM 模型</button>
  <button type="button" id="vrm-reset-btn" class="vrm-btn vrm-btn--sub" hidden title="恢复默认 VRM 角色模型">恢复默认</button>
</div>
<div id="stage"></div>
<div class="vig"></div>
<div id="joy" hidden><div id="joy-knob"></div></div>
<input type="file" id="vrm-file" accept=".vrm,.glb" hidden>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@0.6.5/lib/three-vrm.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/objects/Reflector.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
(function () {
'use strict';
const CN = '"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Source Han Sans SC",sans-serif';
const SIGNF = '"ZCOOL QingKe HuangYou",' + CN;
const REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

const fontsReady = (document.fonts && document.fonts.load) ? Promise.all([
  document.fonts.load('900 80px "Noto Sans SC"', '晴雨便利店二十四小时营业关东煮热饮包子冷饮便当饭团零食日用品小心地滑欢迎光临新品上市慢空瓶罐收银台员工通道冰淇淋谢谢惠顾现磨咖啡雨夜街角号'),
  document.fonts.load('700 80px "Noto Sans SC"', '晴雨便利店关东煮热饮'),
  document.fonts.load('80px "ZCOOL QingKe HuangYou"', '晴雨便利店24小时营业')
]).catch(() => {}) : Promise.resolve();
Promise.race([fontsReady, new Promise(r => setTimeout(r, 3500))]).then(init);

function init() {
// ---------- seeded random for stable layout ----------
let seed = 20261012;
function rnd() { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
const rr = (a, b) => a + (b - a) * rnd();
const pick = a => a[Math.floor(rnd() * a.length)];
const PI = Math.PI;

// ---------- renderer / scene ----------
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
const PR = Math.min(window.devicePixelRatio || 1, 2);
renderer.setPixelRatio(PR);
renderer.setSize(innerWidth, innerHeight);
stage.appendChild(renderer.domElement);
const ANISO = Math.min(8, renderer.capabilities.getMaxAnisotropy());

const scene = new THREE.Scene();
scene.background = (function () {
  const c = document.createElement('canvas'); c.width = 4; c.height = 256;
  const g = c.getContext('2d'); const gr = g.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, '#04070e'); gr.addColorStop(.55, '#0a1222'); gr.addColorStop(1, '#141d33');
  g.fillStyle = gr; g.fillRect(0, 0, 4, 256); return new THREE.CanvasTexture(c);
})();
scene.fog = new THREE.FogExp2(0x0b1426, 0.0105);

const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.1, 400);
const camDir = new THREE.Vector3(0.66, 0.29, 0.69).normalize();
function fitDist() { const a = innerWidth / innerHeight; return 40 * Math.max(1, 1.2 / a); }
const target0 = new THREE.Vector3(-1.2, 2.2, -1.6);
camera.position.copy(target0).addScaledVector(camDir, fitDist());
window.__cam = { camera, controls: { target: new THREE.Vector3() } };


// ---------- toon kit ----------
const grad = new THREE.DataTexture(new Uint8Array([78, 78, 78, 255, 160, 160, 160, 255, 225, 225, 225, 255, 255, 255, 255, 255]), 4, 1, THREE.RGBAFormat);
grad.minFilter = grad.magFilter = THREE.NearestFilter; grad.generateMipmaps = false; grad.needsUpdate = true;

const OUT = 0x141724;
const edgeMat = new THREE.LineBasicMaterial({ color: OUT });
const hullMat = new THREE.MeshBasicMaterial({ color: OUT, side: THREE.BackSide });
const MC = {};
function toon(hex, emi = 0, extra) {
  const k = hex + '|' + emi + (extra ? JSON.stringify(extra) : '');
  if (MC[k]) return MC[k];
  const c = new THREE.Color(hex);
  const m = new THREE.MeshToonMaterial(Object.assign({ color: c, gradientMap: grad }, extra || {}));
  if (emi) m.emissive = c.clone().multiplyScalar(emi);
  return (MC[k] = m);
}
function toonMap(tex, emi = 0, extra) {
  const m = new THREE.MeshToonMaterial(Object.assign({ color: 0xffffff, map: tex, gradientMap: grad }, extra || {}));
  if (emi) { m.emissive = new THREE.Color(emi, emi, emi); m.emissiveMap = tex; }
  return m;
}
const basic = (hex, o) => new THREE.MeshBasicMaterial(Object.assign({ color: hex }, o || {}));
function edges(m, thr = 28) { const e = new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry, thr), edgeMat); m.add(e); return m; }
function hull(m, s = 1.06) { const h = new THREE.Mesh(m.geometry, hullMat); h.scale.setScalar(s); m.add(h); return m; }

const root = new THREE.Group(); scene.add(root);
function box(p, w, h, d, mat, x, y, z, o = {}) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, o.c ? y : y + h / 2, z);
  if (o.rx) m.rotation.x = o.rx; if (o.ry) m.rotation.y = o.ry; if (o.rz) m.rotation.z = o.rz;
  if (o.edge !== false) edges(m);
  p.add(m); return m;
}
function cyl(p, rt, rb, h, mat, x, y, z, o = {}) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, o.seg || 18, 1, !!o.open), mat);
  m.position.set(x, o.c ? y : y + h / 2, z);
  if (o.rx) m.rotation.x = o.rx; if (o.rz) m.rotation.z = o.rz; if (o.ry) m.rotation.y = o.ry;
  if (o.edge) edges(m, 40); if (o.hull) hull(m, o.hull);
  p.add(m); return m;
}
function sph(p, r, mat, x, y, z, o = {}) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, o.seg || 16, o.seg ? o.seg * .75 : 12), mat);
  m.position.set(x, y, z); if (o.s) m.scale.set(o.s[0], o.s[1], o.s[2]);
  if (o.hull) hull(m, o.hull); p.add(m); return m;
}
const UP = new THREE.Vector3(0, 1, 0);
function rod(p, a, b, r, mat, seg = 8) {
  const A = new THREE.Vector3(a[0], a[1], a[2]), B = new THREE.Vector3(b[0], b[1], b[2]);
  const d = B.clone().sub(A), L = d.length();
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, L, seg), mat);
  m.position.copy(A).add(B).multiplyScalar(.5); m.quaternion.setFromUnitVectors(UP, d.normalize());
  p.add(m); return m;
}
function plane(p, w, h, mat, x, y, z, ry = 0, rx = 0) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
  m.position.set(x, y, z); m.rotation.set(rx, ry, 0); p.add(m); return m;
}

// ---------- canvas textures ----------
function ctex(w, h, fn, rep) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); fn(g, w, h);
  const t = new THREE.CanvasTexture(c); t.anisotropy = ANISO;
  if (rep) { t.wrapS = t.wrapT = THREE.RepeatWrapping; }
  return t;
}
function rrect(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function label(text, o) {
  o = Object.assign({ w: 256, h: 96, bg: '#ffffff', fg: '#1d3b37', font: CN, weight: 900, size: 0.62, border: null }, o);
  return ctex(o.w, o.h, (g, w, h) => {
    g.fillStyle = o.bg; g.fillRect(0, 0, w, h);
    if (o.stripe) { g.fillStyle = o.stripe; g.fillRect(0, 0, w, h * .14); g.fillRect(0, h * .86, w, h * .14); }
    if (o.border) { g.strokeStyle = o.border; g.lineWidth = h * .06; g.strokeRect(h * .05, h * .05, w - h * .1, h - h * .1); }
    g.fillStyle = o.fg; g.textAlign = 'center'; g.textBaseline = 'middle';
    let fs = h * o.size; g.font = `${o.weight} ${fs}px ${o.font}`;
    while (g.measureText(text).width > w * .9 && fs > 8) { fs -= 2; g.font = `${o.weight} ${fs}px ${o.font}`; }
    g.fillText(text, w / 2, h / 2 + fs * .04);
  });
}
const PAL = ['#e8564f', '#f39a3d', '#f6cf45', '#5fbf7f', '#3f9ad6', '#7a68d1', '#ef86b0', '#f4f1ea', '#52c1c4', '#cf6a3a', '#9bcf55', '#2f5fa8'];
const DRINK = ['#e8564f', '#f39a3d', '#f6cf45', '#5fbf7f', '#3f9ad6', '#7a68d1', '#ef86b0', '#52c1c4', '#9bcf55', '#ffffff', '#c9473f', '#2f5fa8', '#8a5a3b'];

function drinkRows(g, x0, y0, w, h, rows, bg) {
  g.fillStyle = bg; g.fillRect(x0, y0, w, h);
  const rh = h / rows;
  for (let r = 0; r < rows; r++) {
    const by = y0 + (r + 1) * rh;
    let x = x0 + 6;
    while (x < x0 + w - 18) {
      const col = pick(DRINK), kind = rnd();
      const bw = kind < .4 ? rh * .26 : rh * .3;
      if (kind < .4) { // can
        const ch = rh * .5;
        g.fillStyle = col; rrect(g, x, by - ch - 4, bw, ch, 3); g.fill();
        g.fillStyle = 'rgba(255,255,255,.55)'; g.fillRect(x + bw * .18, by - ch, bw * .14, ch * .7);
        g.fillStyle = '#c8ced6'; g.fillRect(x, by - ch - 6, bw, 4);
      } else { // bottle
        const ch = rh * .74;
        g.fillStyle = col === '#ffffff' ? '#dff3ff' : col;
        rrect(g, x, by - ch * .72 - 4, bw, ch * .72, 5); g.fill();
        g.fillRect(x + bw * .3, by - ch - 4, bw * .4, ch * .3);
        g.fillStyle = pick(['#ffffff', '#f6cf45', '#1d3b37', '#e8564f']);
        g.fillRect(x, by - ch * .48, bw, ch * .2);
        g.fillStyle = pick(['#f4f1ea', '#e8564f', '#2f5fa8', '#5fbf7f']); g.fillRect(x + bw * .28, by - ch - 8, bw * .44, 6);
        g.fillStyle = 'rgba(255,255,255,.45)'; g.fillRect(x + bw * .16, by - ch * .68, bw * .12, ch * .5);
      }
      x += bw + 5;
    }
    g.fillStyle = 'rgba(70,90,110,.45)'; g.fillRect(x0, by - 4, w, 4);
    g.fillStyle = '#fff6d8'; g.fillRect(x0, by - 2, w, 2);
  }
}

// ---------- layout constants ----------
const X0 = -9.6, X1 = 3, Z0 = -9.6, Z1 = 1;
const GT = 2.6, CEIL = 2.78, SB0 = 2.8, SB1 = 3.45, F2 = 3.6, TOP = 7.4;
const AW_IN = 2.74, AW_OUT = 2.45, AW_P = 1.5, AW_PS = 1.3;

// ============ BASE ============
const baseSide = ctex(1024, 64, (g, w, h) => {
  g.fillStyle = '#3b2c22'; g.fillRect(0, 0, w, h);
  g.fillStyle = '#4c5260'; g.fillRect(0, 0, w, h * .18);
  g.fillStyle = '#5c5146'; g.fillRect(0, h * .18, w, h * .2);
  for (let i = 0; i < 900; i++) { g.fillStyle = rnd() < .5 ? 'rgba(160,150,135,.5)' : 'rgba(30,24,20,.5)'; const y = h * .18 + rnd() * h * .2; g.fillRect(rnd() * w, y, 2 + rnd() * 3, 2); }
  for (let i = 0; i < 260; i++) { g.fillStyle = `rgba(${90 + rnd() * 40},${70 + rnd() * 30},${55 + rnd() * 20},.6)`; g.beginPath(); g.ellipse(rnd() * w, h * .45 + rnd() * h * .52, 2 + rnd() * 5, 1.5 + rnd() * 3, 0, 0, 7); g.fill(); }
  g.fillStyle = 'rgba(0,0,0,.25)'; g.fillRect(0, h * .37, w, 2);
});
{
  const secMat = toonMap(baseSide, 0.05);
  const dark = toon(0x1e1814);
  box(root, 20, 0.6, 20, [secMat, secMat, dark, dark, secMat, secMat], 0, -0.6, 0);
  const wood = toon(0x2b2119, 0.04);
  box(root, 21.2, 0.85, 21.2, wood, 0, -1.45, 0);
  box(root, 20.7, 0.05, 20.7, toon(0x3a2d22, .04), 0, -0.62, 0);
  const plaque = ctex(512, 96, (g, w, h) => {
    const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, '#d8b26a'); gr.addColorStop(1, '#a87c3c');
    g.fillStyle = gr; g.fillRect(0, 0, w, h); g.strokeStyle = '#5e4320'; g.lineWidth = 4; g.strokeRect(8, 8, w - 16, h - 16);
    g.fillStyle = '#3e2a12'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.font = `700 40px ${CN}`; g.fillText('晴雨便利店 · 雨夜街角', w / 2, h / 2 + 2);
  });
  plane(root, 3.6, 0.62, toonMap(plaque, 0.12), 0, -1.03, 10.61);
}

// ============ WET GROUND (reflector + baked ground) ============
const PUDDLES = [[-3.6, 6.6, 1.7, .8], [1.4, 3.3, 1.0, .55], [4.9, -3.4, .7, 1.5], [8.1, 7.3, 1.6, 1.1], [-7.4, 3.4, 1.2, .5], [8.4, -4.2, .9, 1.8], [-8.2, 8.6, 1.4, .7], [2.6, 7.9, 1.1, .6], [7.6, 1.2, .7, .9], [4.6, -8.3, .6, .9]];
function buildGround() {
  const S = 2048, k = S / 20, X = x => (x + 10) * k, Z = z => (z + 10) * k;
  const a = document.createElement('canvas'); a.width = a.height = S; const g = a.getContext('2d');
  const b = document.createElement('canvas'); b.width = b.height = S; const w = b.getContext('2d');
  // road
  g.fillStyle = '#141925'; g.fillRect(0, 0, S, S);
  for (let i = 0; i < 70000; i++) { g.fillStyle = rnd() < .5 ? 'rgba(120,135,160,.07)' : 'rgba(0,0,0,.12)'; g.fillRect(rnd() * S, rnd() * S, 2 + rnd() * 2, 2); }
  // tar seams
  g.strokeStyle = 'rgba(5,6,10,.5)'; g.lineWidth = 3;
  for (let i = 0; i < 8; i++) { g.beginPath(); let x = X(rr(-10, 10)), y = Z(rr(5, 10)); g.moveTo(x, y); for (let j = 0; j < 6; j++) { x += rr(-60, 60); y += rr(-30, 30); g.lineTo(x, y); } g.stroke(); }
  // sidewalk
  g.fillStyle = '#323a4a'; g.fillRect(X(-10), Z(-10), (16.2) * k, (14.6) * k);
  const ts = 0.55 * k;
  for (let x = X(-10); x < X(6.2); x += ts) for (let y = Z(-10); y < Z(4.6); y += ts) {
    g.fillStyle = `rgba(${rnd() < .5 ? '255,255,255' : '0,0,0'},${rr(0, .05)})`; g.fillRect(x, y, ts, ts);
  }
  g.strokeStyle = '#232936'; g.lineWidth = 3;
  for (let x = X(-10); x <= X(6.2); x += ts) { g.beginPath(); g.moveTo(x, Z(-10)); g.lineTo(x, Z(4.6)); g.stroke(); }
  for (let y = Z(-10); y <= Z(4.6); y += ts) { g.beginPath(); g.moveTo(X(-10), y); g.lineTo(X(6.2), y); g.stroke(); }
  // tactile paving strip
  g.fillStyle = '#7a6a2e'; g.fillRect(X(-10), Z(3.55), 16.2 * k - 1.0 * k, 0.32 * k); g.fillRect(X(5.2), Z(-10), 0.32 * k, 13.9 * k);
  g.fillStyle = 'rgba(40,32,10,.6)'; for (let x = X(-10); x < X(5.2); x += 9) g.fillRect(x, Z(3.55) + 4, 3, 0.32 * k - 8);
  for (let y = Z(-10); y < Z(3.9); y += 9) g.fillRect(X(5.2) + 4, y, 0.32 * k - 8, 3);
  // road edge lines
  g.fillStyle = '#8f98ab'; g.fillRect(X(-10), Z(4.92), 13.3 * k, .09 * k); g.fillRect(X(6.5), Z(-10), .09 * k, 11.7 * k);
  // crosswalks
  g.fillStyle = '#a9b2c4';
  for (let z = 5.15; z < 9.9; z += .9) g.fillRect(X(3.5), Z(z), 2.4 * k, .45 * k);
  for (let x = 6.8; x < 9.95; x += .9) g.fillRect(X(x), Z(1.9), .45 * k, 2.4 * k);
  g.fillRect(X(3.2), Z(5.1), .14 * k, 4.8 * k);
  // painted 慢
  g.save(); g.translate(X(-4.6), Z(7.5)); g.scale(1, 1.4); g.fillStyle = 'rgba(214,220,232,.82)'; g.font = `900 ${1.7 * k}px ${CN}`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('慢', 0, 0); g.restore();
  g.save(); g.translate(X(8.2), Z(-5.2)); g.scale(1, 1.4); g.fillStyle = 'rgba(214,220,232,.8)'; g.font = `900 ${1.5 * k}px ${CN}`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('慢', 0, 0); g.restore();

  const fwx = Math.sin(P.heading), fwz = Math.cos(P.heading);
  const catD = Math.hypot(cat.g.position.x - P.pos.x, cat.g.position.z - P.pos.z);
  const toCam = vA.copy(camera.position).sub(P.pos); toCam.y = 0; toCam.normalize();
  if (catD < 2.4) cat.head.getWorldPosition(vB);
  else if (toCam.x * fwx + toCam.z * fwz > .35 && P.speed < .3) vB.copy(camera.position);
  else vB.set(P.pos.x + fwx * 3, 1.25, P.pos.z + fwz * 3);
  P.look.lerp(vB, 1 - Math.exp(-dt * 4)); lookObj.position.copy(P.look);
  const lx = P.look.x - P.pos.x, lz = P.look.z - P.pos.z;
  const lyaw = Math.max(-.75, Math.min(.75, angDiff(Math.atan2(lx, lz), P.heading)));
  const lpitch = Math.max(-.45, Math.min(.3, Math.atan2(P.look.y - 1.3, Math.hypot(lx, lz))));
  if (!rig) return;
  animateRig(rig, { phase: P.phase, walk: w, run: rn, t, hold, carry: true, lean: Math.max(-.12, Math.min(.12, -turnRate * P.speed * .02)), lookY: lyaw, lookP: lpitch });

  if (rig.isVRM) {
    const bs = rig.vrm.blendShapeProxy;
    P.blinkT -= dt; if (P.blinkT < 0) { P.blink = .16; P.blinkT = 2 + Math.random() * 3.5; }
    P.blink = Math.max(0, P.blink - dt);
    P.joy += ((catD < 1.6 ? .7 : 0) - P.joy) * (1 - Math.exp(-dt * 3));
    if (bs) { bs.setValue('joy', P.joy); bs.setValue('blink', P.joy > .3 ? 0 : (P.blink > 0 ? Math.sin((P.blink / .16) * PI) : 0)); }
    rig.vrm.update(dt);
  }
  holder.updateMatrixWorld(true);

  // place umbrella
  const B = rig.bones;
  B.rightHand.getWorldPosition(vA); (B.rightMiddleProximal || B.rightHand).getWorldPosition(vB); grip.lerpVectors(vA, vB, .75);
  B.head.getWorldPosition(vH);
  dirO.set(vH.x - fwx * .05, vH.y + .62, vH.z - fwz * .05).sub(grip).normalize();
  if (dirO.y < .55) { dirO.y = .55; dirO.normalize(); }
  qO.setFromUnitVectors(UP, dirO);
  dirH.set(fwx * .62, -1, fwz * .62).normalize(); qH.setFromUnitVectors(UP, dirH);
  const flip = P.umb < .32 ? smooth(0, 1, 1 - P.umb / .32) : 0;
  umb.position.copy(grip); umb.quaternion.copy(qO).slerp(qH, flip);
  const o = smooth(.32, 1, P.umb);
  canopy.scale.set(mix(.085, 1, o), mix(1.75, 1, o), mix(.085, 1, o));
  canopy.getWorldPosition(umbC); umbC.y -= .12; umbR = o > .5 ? .5 * o : 0;
  // rim drips
  if (o > .95 && exposed) {
    rimAcc += dt * (6 + P.speed * 3);
    while (rimAcc > 1) {
      rimAcc--; const d = rimDrops[rimIdx++ % rimDrops.length], a = Math.floor(Math.random() * 8) * PI / 4;
      d.m.position.set(Math.sin(a) * .52, -.35, Math.cos(a) * .52); canopy.localToWorld(d.m.position);
      d.v = .4; d.on = true; d.m.visible = true;
    }
  }
  for (const d of rimDrops) {
    if (!d.on) continue;
    d.v += 9.8 * dt; d.m.position.y -= d.v * dt;
    if (d.m.position.y <= .02) { d.on = false; d.m.visible = false; if (floorAt(d.m.position.x, d.m.position.z) === 0) ripple(d.m.position.x, d.m.position.z, .16, .013, .55); }
  }
}

window.__game = { player, cam, keys, umb, blob, holder, rimDrops, bloom: () => bloom, scene };
// ---- third-person camera ----
const CAM_BOXES = [
  [X0, X1 + .25, CEIL - .02, TOP + .45, Z0, Z1 + .25],
  [X0 - 2, X0 + .18, -1, CEIL, Z0 - 2, Z1], [X0 - 2, X1 + .1, -1, CEIL, Z0 - 2, Z0 + .18],
  [X0, X1 + AW_PS, AW_OUT - .32, AW_IN + .08, Z1, Z1 + AW_P], [X1, X1 + AW_PS, AW_OUT - .32, AW_IN + .08, Z0, Z1]
];
function rayBoxes(o, d, maxT) {
  let best = maxT;
  for (const b of CAM_BOXES) {
    let t0 = -Infinity, t1 = Infinity;
    for (let a = 0; a < 3; a++) {
      const oo = a === 0 ? o.x : a === 1 ? o.y : o.z, dd = a === 0 ? d.x : a === 1 ? d.y : d.z, lo = b[a * 2], hi = b[a * 2 + 1];
      if (Math.abs(dd) < 1e-8) { if (oo < lo || oo > hi) { t0 = Infinity; break; } continue; }
      let ta = (lo - oo) / dd, tb = (hi - oo) / dd; if (ta > tb) { const s = ta; ta = tb; tb = s; }
      t0 = Math.max(t0, ta); t1 = Math.min(t1, tb);
    }
    if (t0 <= t1 && t0 > 0 && t0 < best) best = t0;
  }

}
const camOff = new THREE.Vector3(), headT = new THREE.Vector3();
function updateCamera(dt) {
  const kA = 1 - Math.exp(-dt * (cam.intro ? 1.0 : 10)), kD = 1 - Math.exp(-dt * (cam.intro ? .85 : 7));
  cam.theta += angDiff(cam.thetaT, cam.theta) * kA; cam.phi += (cam.phiT - cam.phi) * kA; cam.dist += (cam.distT - cam.dist) * kD;
  if (cam.intro && Math.abs(cam.dist - cam.distT) < .05) cam.intro = false;
  headT.set(player.pos.x, 1.2, player.pos.z).lerp(DIORAMA_C, smooth(9, 30, cam.dist));
  cam.target.lerp(headT, cam.intro ? 1 : 1 - Math.exp(-dt * 10));
  camOff.set(Math.sin(cam.phi) * Math.sin(cam.theta), Math.cos(cam.phi), Math.sin(cam.phi) * Math.cos(cam.theta));
  let d = cam.dist;
  const near = 1 - smooth(8, 13, cam.dist);
  if (near > 0) {
    const hit = rayBoxes(cam.target, camOff, d + .2);
    if (hit < d + .2) d = mix(d, Math.max(.45, hit - .2), near);
  }
  camera.position.copy(cam.target).addScaledVector(camOff, d);
  camera.lookAt(cam.target);
}

// ---------- resize ----------
let composer, bloom;
(function setupPost() {
  let rt;
  if (renderer.capabilities.isWebGL2 && THREE.WebGLMultisampleRenderTarget) {
    rt = new THREE.WebGLMultisampleRenderTarget(innerWidth * PR, innerHeight * PR, { format: THREE.RGBAFormat });
  }
  composer = new THREE.EffectComposer(renderer, rt);
  composer.setPixelRatio && composer.setPixelRatio(PR);
  composer.setSize(innerWidth, innerHeight);
  composer.addPass(new THREE.RenderPass(scene, camera));
  bloom = new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), .7, .55, .9);
  composer.addPass(bloom);
})();
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight); bloom.setSize(innerWidth, innerHeight);
});

// ---------- animation ----------
const clock = new THREE.Clock();
const RS = REDUCED ? .45 : 1;
let doorT = 5, doorPhase = 0, doorOpen = 0, doorHold = 0;
let signBurst = 0, bladeBurst = 0, tvT = 0, sigT = 0, ripAcc = 0;
const tmp = new THREE.Vector3();
function frame() {
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;
  updatePlayer(dt, t);
  // rain
  for (let i = 0; i < RN; i++) {
    const d = rain[i];
    d.y -= d.v * dt * RS; d.x += WIND * dt * RS;
    if (d.x > 10) d.x -= 20;
    let fl = floorAt(d.x, d.z);
    if (umbR > 0) { const ux = d.x - umbC.x, uz = d.z - umbC.z; if (ux * ux + uz * uz < umbR * umbR && fl < umbC.y) fl = umbC.y; }
    if (d.y < fl) {
      if (fl === 0 && Math.random() < .05) ripple(d.x, d.z, .14 + Math.random() * .1, .012, .5);
      d.y = 12 + Math.random() * 4; d.x = -10 + Math.random() * 20; d.z = -10 + Math.random() * 20;
    }
    const o = i * 6, l = Math.min(LEN, Math.max(0, 15 - d.y));
    rainPos[o] = d.x; rainPos[o + 1] = Math.max(d.y, fl); rainPos[o + 2] = d.z;
    rainPos[o + 3] = d.x - WIND * l / d.v; rainPos[o + 4] = Math.max(d.y + l, fl); rainPos[o + 5] = d.z;
  }
  rainGeo.attributes.position.needsUpdate = true;
  // puddle ripples
  ripAcc += dt * 26 * RS;
  while (ripAcc > 1) { ripAcc--; const p = randomGroundPoint(); if (p) ripple(p[0], p[1], .2 + Math.random() * .22); }
  for (const r of ripples) {
    if (!r.m.visible) continue;
    r.t += dt / r.life;
    if (r.t >= 1) { r.m.visible = false; continue; }
    const s = .05 + r.size * r.t; r.m.scale.set(s, s, s); r.m.material.opacity = .55 * (1 - r.t) * (1 - r.t);
  }
  // drips
  for (const d of drips) {
    if (!d.falling) {
      d.phase += dt * RS / d.period;
      const g = Math.min(1, d.phase); d.bead.scale.setScalar(.25 + g * .9); d.bead.position.y = d.y - g * .03;
      if (d.phase >= 1) { d.falling = true; d.fy = d.y - .04; d.fv = 0; d.fall.visible = true; d.phase = 0; d.period = 1.3 + Math.random() * 2.6; d.bead.scale.setScalar(.2); }
    } else {
      d.fv += 14 * dt * RS; d.fy -= d.fv * dt * RS;
      d.fall.position.set(d.x, d.fy, d.z); d.fall.scale.set(.8, 1.6, .8);
      if (d.fy <= d.landY + .02) { d.falling = false; d.fall.visible = false; ripple(d.x, d.z, .32, .014, .9); }
    }
  }
  // steam
  for (const s of steams) for (const p of s.arr) {
    const k = (t * s.speed * RS + p.off) % 1;
    p.s.position.set(s.x + p.dx * (1 + k) + Math.sin(t * .7 + p.off * 6) * .05 * k, s.y + k * s.rise, s.z + p.dz * (1 + k));
    const sc = s.size * (.4 + k); p.s.scale.set(sc, sc, 1); p.s.material.opacity = s.op * Math.sin(PI * k);
  }
  // signs flicker
  if (!REDUCED) {
    if (signBurst > 0) signBurst -= dt; else if (Math.random() < dt * .07) signBurst = .2 + Math.random() * .3;
    const sl = signBurst > 0 ? (Math.random() < .45 ? .45 : 1) : .97 + .03 * Math.sin(t * 37);
    signMatF.color.setScalar(sl); signMatS.color.setScalar(sl * .98); signLight.intensity = .35 * sl;
    if (bladeBurst > 0) bladeBurst -= dt; else if (Math.random() < dt * .22) bladeBurst = .15 + Math.random() * .5;
    bladeMats[1].color.setScalar(bladeBurst > 0 ? (Math.random() < .5 ? .25 : .9) : 1);
  }
  // tv window
  tvT -= dt; if (tvT <= 0) { tvT = .25 + Math.random() * 1.4; tvMat.color.setHSL(.55 + Math.random() * .12, .6, .35 + Math.random() * .3); }
  // pedestrian signal (cycle 22s: red 15, green 5, blink 2)
  sigT = (t % 22);
  const green = sigT > 15 && (sigT < 20 || Math.floor(sigT * 4) % 2 === 0);
  sigRed.color.setScalar(green ? .18 : 1); sigGreen.color.setScalar(green ? 1 : .15);
  sigGlow.material.color.set(green ? 0x4dffb5 : 0xff5a4a); sigGlow.position.y = green ? 2.77 : 3.05;
  // automatic door
  doorT -= dt;
  if (Math.hypot(player.pos.x - 0.7, player.pos.z - Z1) < 1.75) { if (doorPhase === 0 || doorPhase === 3) doorPhase = 1; else if (doorPhase === 2) doorHold = Math.max(doorHold, .7); }
  if (doorPhase === 0 && doorT <= 0) doorPhase = 1;
  if (doorPhase === 1) { doorOpen = Math.min(1, doorOpen + dt / .7); if (doorOpen >= 1) { doorPhase = 2; doorHold = 2.2 + Math.random() * 1.5; } }
  else if (doorPhase === 2) { doorHold -= dt; if (doorHold <= 0) doorPhase = 3; }
  else if (doorPhase === 3) { doorOpen = Math.max(0, doorOpen - dt / .9); if (doorOpen <= 0) { doorPhase = 0; doorT = 9 + Math.random() * 10; } }
  const e = doorOpen * doorOpen * (3 - 2 * doorOpen);
  doorL.position.x = .15 - e * 1.02; doorR.position.x = 1.25 + e * 1.02;
  doorLight.intensity = .5 + e * .6;
  sensorLed.material.color.set(doorPhase ? 0x44ff88 : 0xff4040);
  // clerk & customer & cat
  const bow = doorPhase === 1 || doorPhase === 2 ? Math.min(1, (doorPhase === 2 ? 1 : doorOpen)) : Math.max(0, doorOpen);
  const pin = inStore(player.pos.x, player.pos.z), cyaw = pin ? Math.max(-.9, Math.min(.9, Math.atan2(player.pos.x - .6, player.pos.z + 8.25))) : Math.sin(t * .45) * .22;
  clerk.head.rotation.y += (cyaw * (1 - bow) - clerk.head.rotation.y) * (1 - Math.exp(-dt * 4)); clerk.head.rotation.x = bow * .25;
  clerk.torso.rotation.x = bow * .08;
  customer.head.rotation.x = .08 + Math.sin(t * .6) * .03; customer.head.rotation.y = Math.sin(t * .23) * .12;
  customer.torso.scale.y = 1 + Math.sin(t * 1.6) * .012;
  const cdx = player.pos.x - cat.g.position.x, cdz = player.pos.z - cat.g.position.z, cnear = Math.hypot(cdx, cdz) < 3.2;
  const cyw = cnear ? Math.max(-1.1, Math.min(1.1, angDiff(Math.atan2(cdx, cdz), cat.g.rotation.y))) : Math.sin(t * .37) * .35 + Math.sin(t * 2.1) * .04;
  cat.head.rotation.y += (cyw - cat.head.rotation.y) * (1 - Math.exp(-dt * 5)); cat.head.rotation.x = cnear ? -.25 : 0;
  cat.tail.rotation.y = Math.sin(t * (cnear ? 4 : 1.3)) * .5;
  // reflector shimmer
  reflector.material.uniforms.time.value = t * RS;
  if (!window.__externalCamera) updateCamera(dt);
  { const ci = smooth(.3, -.6, Math.max(camera.position.x - X1, camera.position.z - Z1, X0 - camera.position.x, Z0 - camera.position.z)) * (camera.position.y < CEIL ? 1 : 0);
    bloom.strength = mix(.7, .32, ci); bloom.threshold = mix(.9, .96, ci); }
  composer.render();

}
frame();
}
})();
